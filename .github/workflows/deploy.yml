name: Check and deploy demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nasa2026-${{ github.event_name == 'pull_request' && github.ref || 'live-demo' }}
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_PAGER: ''
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check backend
        run: |
          python -m pip install -r backend/requirements.txt
          (cd backend && python -m pytest -q)
      - name: Check frontend JavaScript
        run: |
          node --check frontend/app.js
          node --check frontend/workflow.js
          node --check frontend/language.js
          node --check frontend/translations-es.js
          node --check frontend/slides.js
          for f in frontend/js/*.js; do
            if [ "$f" = "frontend/js/relief.js" ]; then node --check --input-type=module < "$f"; else node --check "$f"; fi
          done
          node --test frontend/tests/workflow.test.cjs
          node --test frontend/tests/language.test.cjs
          node --test frontend/tests/slides.test.cjs
          node --check --input-type=module < frontend/slides3d.js
          python scripts/check_frontend_scripts.py
      - name: Validate deployment scripts and package release
        run: |
          bash -n deploy/vm/install.sh
          bash -n deploy/vm/activate-release.sh
          bash -n deploy/vm/enable-https.sh
          bash -n deploy/vm/configure-proxy.sh
          bash -n deploy/vm/enable-domain.sh
          python scripts/package_release.py
      - name: Verify deployment identity context
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import base64, json, os
          from urllib.request import Request, urlopen
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com'
          request = Request(url, headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urlopen(request, timeout=20) as response:
              token = json.load(response)['value']
          payload = token.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
          print(json.dumps({key: claims.get(key) for key in ('iss','aud','sub','repository','ref','event_name')}, indent=2))
          assert claims['aud'] == 'sts.amazonaws.com'
          assert claims['sub'] == 'repo:AlexisBaladon@93690531/nasa2026@1457777955:ref:refs/heads/main'
          PY
      - name: Authenticate deployment to AWS
        id: aws
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::358161326463:role/nasa2026-github-deploy
          aws-region: us-east-1
          role-duration-seconds: 900
          allowed-account-ids: '358161326463'
      - name: Deploy and verify
        if: steps.aws.outcome == 'success'
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_ATTEMPT: ${{ github.run_attempt }}
        run: python scripts/ci_deploy.py deploy
      - name: Close temporary SSH access
        if: always() && steps.aws.outcome == 'success'
        run: python scripts/ci_deploy.py cleanup
