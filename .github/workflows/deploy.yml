name: Check and deploy demo

on:
  push:
    branches: [work/aws-demo]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nasa2026-${{ github.event_name == 'pull_request' && github.ref || 'live-demo' }}
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: /api
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_PAGER: ''
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check backend
        run: |
          python -m pip install ./api
          (cd api && python -m unittest discover -s tests -v)
      - name: Install frontend
        run: npm ci --prefix web --no-fund
      - name: Build static frontend and check types
        working-directory: web
        run: |
          npm run build
          npm run lint
      - name: Validate deployment scripts and package release
        run: |
          bash -n deploy/vm/install.sh
          bash -n deploy/vm/activate-release.sh
          bash -n deploy/vm/enable-https.sh
          python scripts/package_release.py
      - name: Authenticate deployment to AWS
        id: aws
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/work/aws-demo'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::358161326463:role/nasa2026-github-deploy
          aws-region: us-east-1
          role-duration-seconds: 900
          allowed-account-ids: '358161326463'
      - name: Deploy and verify
        if: steps.aws.outcome == 'success'
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_ATTEMPT: ${{ github.run_attempt }}
        run: python scripts/ci_deploy.py deploy
      - name: Close temporary SSH access
        if: always() && steps.aws.outcome == 'success'
        run: python scripts/ci_deploy.py cleanup
