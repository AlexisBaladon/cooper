    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;
    limit_conn nasa_connections 20;
    limit_req_status 429;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options $nasa_frame_options always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /opt/nasa2026/current/public;
    index index.html;

    location = /version.json {
        expires -1;
        try_files $uri =404;
    }
    location /_next/static/ {
        try_files $uri @previous_assets;
    }
    location @previous_assets {
        root /opt/nasa2026/previous/public;
        try_files $uri =404;
    }

    location = /api/compare {
        limit_except POST { deny all; }
        limit_req zone=nasa_per_ip burst=5 nodelay;
        limit_req zone=nasa_global burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000/compare;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location = /api/health {
        limit_except GET { deny all; }
        limit_req zone=nasa_per_ip burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000/health;
    }
    location = /api/catalog {
        limit_except GET { deny all; }
        limit_req zone=nasa_per_ip burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000/api/catalog;
    }
    location = /api/analyze {
        limit_except POST { deny all; }
        limit_conn nasa_connections 1;
        limit_conn nasa_backend_connections 2;
        limit_req zone=nasa_per_ip burst=2 nodelay;
        limit_req zone=nasa_global burst=2 nodelay;
        proxy_pass http://127.0.0.1:8000/api/analyze;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 180s;
    }
    location = /api/narrate {
        limit_except POST { deny all; }
        limit_conn nasa_connections 1;
        limit_conn nasa_backend_connections 2;
        limit_req zone=nasa_narration_ip burst=2 nodelay;
        limit_req zone=nasa_narration_global burst=2 nodelay;
        proxy_pass http://127.0.0.1:8000/api/narrate;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
    # "Ask Cooper". Separate connection pool, so waiting on Groq never blocks /api/analyze.
    location = /api/chat {
        limit_except POST { deny all; }
        client_max_body_size 64k;                    # 6 messages + the analysis summary
        limit_conn nasa_connections 3;                # voice requests may be in flight
        limit_conn nasa_assistant_connections 4;
        limit_req zone=nasa_chat_ip burst=5 nodelay;
        limit_req zone=nasa_chat_global burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000/api/chat;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 90s;                      # 2 Groq attempts + a short retry wait
    }
    location = /api/transcribe {
        limit_except POST { deny all; }
        client_max_body_size 3m;                     # backend MAX_AUDIO_BYTES
        client_body_timeout 30s;                     # voice notes from slow phone connections
        limit_conn nasa_connections 3;                # voice requests may be in flight
        limit_conn nasa_assistant_connections 4;
        limit_req zone=nasa_voice_ip burst=3 nodelay;
        limit_req zone=nasa_voice_global burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000/api/transcribe;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 150s;
    }
    # Voz (ElevenLabs): una frase por pedido; el backend guarda las ya generadas.
    location = /api/voice {
        limit_except POST { deny all; }
        client_max_body_size 4k;
        limit_conn nasa_connections 6;
        limit_conn nasa_assistant_connections 8;
        limit_req zone=nasa_speech_ip burst=30 nodelay;
        limit_req zone=nasa_speech_global burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000/api/voice;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 45s;
    }
    # Jarvis a pantalla completa: mismos límites que el chat y la voz de "Ask Cooper".
    location = /api/jarvis/chat {
        limit_except POST { deny all; }
        client_max_body_size 96k;                    # 12 turns + field file + analysis summary
        limit_conn nasa_connections 3;                # voice requests may be in flight
        limit_conn nasa_assistant_connections 4;
        limit_req zone=nasa_chat_ip burst=5 nodelay;
        limit_req zone=nasa_chat_global burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000/api/jarvis/chat;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;                     # JSON reply, plus a plain-text retry
    }
    location = /api/jarvis/transcribe {
        limit_except POST { deny all; }
        client_max_body_size 3m;
        client_body_timeout 30s;
        limit_conn nasa_connections 3;                # voice requests may be in flight
        limit_conn nasa_assistant_connections 4;
        limit_req zone=nasa_voice_ip burst=3 nodelay;
        limit_req zone=nasa_voice_global burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000/api/jarvis/transcribe;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 150s;
    }
    location = /api/jarvis/translate {
        limit_except POST { deny all; }
        client_max_body_size 128k;                   # up to 160 report texts
        limit_conn nasa_connections 3;                # voice requests may be in flight
        limit_conn nasa_assistant_connections 4;
        limit_req zone=nasa_chat_ip burst=5 nodelay;
        limit_req zone=nasa_chat_global burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000/api/jarvis/translate;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
    }
    location = /api/assistant {
        limit_except POST { deny all; }
        client_max_body_size 24k;
        limit_conn nasa_connections 3;                # voice requests may be in flight
        limit_req zone=nasa_assistant_ip burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000/api/assistant;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 40s;
    }
    location = /api/weather {
        limit_except GET { deny all; }
        limit_req zone=nasa_per_ip burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000/api/weather$is_args$args;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location = /api/soil {
        limit_except GET { deny all; }
        limit_req zone=nasa_per_ip burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000/api/soil$is_args$args;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
    # No NASA download proxy, docs or administration endpoints in the public demo.
    location = /api/whatsapp/webhook {
        limit_except POST { deny all; }
        client_max_body_size 32k;
        limit_req zone=nasa_per_ip burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000/api/whatsapp/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location /api/ { return 404; }
    location ~ /\. { deny all; }
    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
    }
